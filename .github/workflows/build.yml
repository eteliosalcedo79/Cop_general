name: Compilar APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Instalar dependencias
        run: npm install

      - name: Renombrar carpeta a minúscula
        run: |
          if [ -d "Android" ]; then mv Android android; fi
        
      - name: Sincronizar archivos web
        run: npx cap sync
        
      - name: Generar iconos desde logo.png
        run: npx @capacitor/assets generate --android

      # --- ESTO ARREGLA LOS XML AUTOMÁTICAMENTE ---
      - name: Configurar iconos adaptativos
        run: |
          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      # --------------------------------------------
        
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
