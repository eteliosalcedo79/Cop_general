name: Compilar APK y Generar Proyecto Android
on: workflow_dispatch   # Solo manual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Instalar dependencias
        run: npm install
        
      - name: Generar proyecto Android
        run: npx cap add android

      # --- ESTO ES LO QUE TE FALTABA PARA LOS ICONOS ---
      # Asegúrate de tener un archivo logo.png (1024x1024) en la raíz de tu repo
      - name: Generar Iconos y Splash Screens
        run: npx @capacitor/assets generate --android
      # -------------------------------------------------
        
      - name: Sincronizar archivos web
        run: npx cap sync
        
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # --- ESTO ES LO NUEVO PARA DESCARGAR TODO EL PROYECTO ---
      - name: Empaquetar todo el proyecto Android (Fuente)
        uses: actions/upload-artifact@v4
        with:
          name: Proyecto-Android-Completo
          path: android/  # <--- Aquí le decimos que guarde TODA la carpeta
