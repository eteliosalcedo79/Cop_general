name: Compilar APK 

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Instalar dependencias
        run: npm install

      # 1. Arregla el nombre de la carpeta si está como "Android"
      - name: Renombrar carpeta a minúscula
        run: |
          if [ -d "Android" ]; then mv Android android; fi
        
      # 2. Sincroniza los archivos de la carpeta www con Android
      - name: Sincronizar archivos web
        run: npx cap sync

      # 3. Genera los iconos desde tu logo.png en la raíz
      - name: Generar iconos desde logo.png
        run: npx @capacitor/assets generate --android
        
      # 4. Compila el APK
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      # 5. Guarda el APK para que lo descargues
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
