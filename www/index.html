<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CineHax + Latanime TV</title>
<style>
  :root{
    --bg:#0d1117; --sidebar:#161b22; --card:#1b2230; --text:#e6edf3;
    --muted:#8b949e; --accent:#e50914; --border:#30363d;
  }
  *{box-sizing:border-box; outline:none;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    width:100vw; height:100vh; overflow:hidden; display:flex;
  }
  
  /* --- BARRA LATERAL --- */
  aside {
    width: 15vw; min-width: 200px; max-width: 260px; background: var(--sidebar);
    display: flex; flex-direction: column; padding: 3vh 1vw;
    border-right: 1px solid var(--border); z-index: 10;
  }
  aside h1 { color: var(--accent); font-size: 2vw; font-weight: 900; margin: 0 0 3vh 0; text-align: center;}
  aside nav { 
    display: flex; flex-direction: column; gap: 1.5vh; 
    flex: 1; justify-content: center;
  }
  aside button {
    background: transparent; color: var(--muted); border: 2px solid transparent;
    padding: 1.2vh 1vw; border-radius: 8px; font-size: 1.3vw; font-weight: bold;
    text-align: left; cursor: pointer; transition: all 0.2s;
  }
  aside button:focus, aside button.active {
    background: var(--card); color: #fff; border-color: var(--accent);
    transform: scale(1.03); box-shadow: 0 0 15px rgba(229,9,20,0.3);
  }

  /* --- CONTENIDO PRINCIPAL --- */
  main {
    flex: 1; padding: 4vh 3vw; overflow-y: auto; overflow-x: hidden;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

  .section { margin-bottom: 4vh; }
  .section h2 { font-size: 1.8vw; margin: 0 0 1.5vh 0; font-weight: 600; }
  
  /* Filas Horizontales */
  .carousel {
    display: flex; gap: 1.5vw; overflow-x: auto; 
    padding: 2vh 1vw 3vh 1vw;
    scroll-behavior: smooth; scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }

  /* Cuadrículas */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(12vw, 1fr)); gap: 2vw; padding: 1vw; }

  /* TARJETAS */
  .card {
    flex: 0 0 12vw; background: var(--card); border-radius: 10px; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
    border: 3px solid transparent; display: flex; flex-direction: column; cursor: pointer;
  }
  .grid .card { flex: none; width: 100%; }
  
  .card:focus {
    transform: scale(1.05); border-color: var(--accent);
    box-shadow: 0 10px 20px rgba(229,9,20,0.4); z-index: 10; position: relative;
  }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #222; }
  .card .meta { padding: 1.5vh 1vw; display: flex; align-items: center; }
  
  .card .title {
    font-size: 1.2vw; font-weight: bold; line-height: 1.2; width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .genre-card {
    display: flex; justify-content: center; align-items: center;
    padding: 3vh; font-size: 1.5vw; font-weight: bold; text-align: center;
  }

  /* BUSCADOR */
  .search-view { display: flex; flex-direction: column; gap: 2vh; margin-bottom: 3vh; margin-top: 2vh; }
  .search-box { display: flex; gap: 1vw; width: 100%; max-width: 800px; }
  .search-box input {
    flex: 1; background: var(--card); border: 2px solid var(--border);
    color: var(--text); padding: 2vh 1.5vw; border-radius: 8px; font-size: 1.5vw;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box button {
    background: var(--accent); color: #fff; border: none; padding: 0 3vw;
    border-radius: 8px; font-size: 1.3vw; font-weight: bold; cursor: pointer;
  }
  .search-box button:focus { box-shadow: 0 0 15px var(--accent); transform: scale(1.05); }

  /* MODAL Y ESTADOS */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.open { display: flex; }
  .modal-inner { background: var(--sidebar); border-radius: 16px; padding: 4vh 4vw; max-width: 70vw; width: 100%; text-align: center; border: 2px solid var(--border); }
  .modal-inner h3 { font-size: 2.5vw; margin: 0 0 2vh 0; color: var(--accent); }
  .modal-inner p { font-size: 1.4vw; color: var(--text); margin-bottom: 3vh; line-height: 1.5; text-align: justify; max-height: 40vh; overflow-y: auto;}
  .modal-inner button { background: var(--accent); color: #fff; border: none; padding: 1.5vh 3vw; font-size: 1.5vw; border-radius: 8px; font-weight: bold; }
  .modal-inner button:focus { box-shadow: 0 0 15px var(--accent); transform: scale(1.05); }
  
  .error { background: #3d1114; border: 1px solid #7a1c20; color: #ffb3b8; padding: 2vh; border-radius: 8px; font-size: 1.5vw; margin: 2vh 0; }
  .loader { text-align: center; padding: 10vh; color: var(--muted); font-size: 2vw; }
</style>
</head>
<body>

<aside>
  <h1>CineHax TV</h1>
  <nav id="main-nav">
    <button data-view="movies" class="active" tabindex="0">Películas</button>
    <button data-view="tv" tabindex="0">Series</button>
    <button data-view="anime" tabindex="0">Anime</button>
    <button data-view="genres" tabindex="0">Géneros</button>
    <button data-view="search" tabindex="0">Buscar</button>
  </nav>
</aside>

<main id="app">
  <div class="loader">Cargando...</div>
</main>

<div class="modal" id="modal">
  <div class="modal-inner">
    <h3 id="modal-title">Cargando...</h3>
    <p id="modal-desc">Obteniendo sinopsis...</p>
    <button id="modal-close" tabindex="0">Cerrar</button>
  </div>
</div>

<script>
(() => {
  const CINEHAX_URL = 'https://cinehax.com';
  const LATANIME_URL = 'https://latanime.org';
  const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';
  const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';

  const GENRES_CINEHAX = [
    ['movie:action','Películas: Acción'],['movie:adventure','Películas: Aventura'],
    ['movie:comedy','Películas: Comedia'],['movie:horror','Películas: Terror'],
    ['movie:sci-fi','Películas: Ciencia Ficción'],['movie:drama','Películas: Drama'],
    ['tv:action-adventure','Series: Acción y aventura'],['tv:soap','Series: Telenovela'],
    ['tv:war-politics','Series: Guerra y política'],['tv:sci-fi-fantasy','Series: Ciencia ficción']
  ];

  const GENRES_ANIME = [
    ['anime:accion','Anime: Acción'],['anime:aventura','Anime: Aventura'],
    ['anime:comedia','Anime: Comedia'],['anime:drama','Anime: Drama'],
    ['anime:fantasia','Anime: Fantasía'],['anime:romance','Anime: Romance'],
    ['anime:shonen','Anime: Shonen'],['anime:seinen','Anime: Seinen']
  ];

  const app = document.getElementById('app');
  const navButtons = document.querySelectorAll('#main-nav button');

  async function httpGet(url, referer) {
    if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.CapacitorHttp) {
      throw new Error("CapacitorHttp no está disponible.");
    }
    const headers = { 'User-Agent': UA, 'Accept':'text/html,application/json,*/*' };
    if (referer) headers['Referer'] = referer;
    const res = await window.Capacitor.Plugins.CapacitorHttp.get({ url, headers });
    return typeof res.data === 'string' ? res.data : JSON.stringify(res.data);
  }

  function fixUrl(u, base) {
    if (!u) return '';
    if (u.startsWith('http')) return u;
    if (u.startsWith('//')) return 'https:' + u;
    return base + (u.startsWith('/') ? '' : '/') + u;
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function cardHTML(s) {
    const img = s.poster ? `<img src="${escapeHtml(s.poster)}" onerror="this.style.opacity=.3" loading="lazy">` : `<img loading="lazy">`;
    return `<div class="card" tabindex="0" data-id="${escapeHtml(s.id)}" data-type="${s.type}">
      ${img}
      <div class="meta">
        <div class="title">${escapeHtml(s.title)}</div>
      </div>
    </div>`;
  }

  function autoFocus() {
    setTimeout(() => {
      const first = app.querySelector('.card, .genre-card, input, button');
      if (first) first.focus();
    }, 100);
  }

  function bindCards(container) {
    container.querySelectorAll('.card[data-id]').forEach(c => {
      c.addEventListener('click', () => openDetail(c.getAttribute('data-type'), c.getAttribute('data-id')));
      c.addEventListener('keydown', (e) => { if (e.key === 'Enter') c.click(); });
    });
  }

  function renderHome(cats) {
    let html = '';
    for (const cat of cats) {
      html += `<div class="section"><h2>${escapeHtml(cat.name)}</h2><div class="carousel">${cat.list.map(cardHTML).join('')}</div></div>`;
    }
    app.innerHTML = html || '<div class="loader">Sin resultados</div>';
    bindCards(app);
    autoFocus();
  }

  function renderGrid(title, shows) {
    app.innerHTML = `<div class="section"><h2>${escapeHtml(title)}</h2><div class="grid">${shows.map(cardHTML).join('')}</div></div>`;
    bindCards(app);
    autoFocus();
  }

  function renderGenres() {
    let html = `<div class="section"><h2>Categorías</h2><div class="grid">`;
    [...GENRES_CINEHAX, ...GENRES_ANIME].forEach(([id, name]) => {
      html += `<div class="card genre-card" tabindex="0" data-genre="${escapeHtml(id)}">${escapeHtml(name)}</div>`;
    });
    html += `</div></div>`;
    app.innerHTML = html;
    app.querySelectorAll('.genre-card').forEach(el => {
      el.addEventListener('click', () => loadGenre(el.getAttribute('data-genre'), 1));
      el.addEventListener('keydown', (e) => { if(e.key === 'Enter') el.click(); });
    });
    autoFocus();
  }

  function parseCineHaxCard(a) {
    const href = a.getAttribute('href') || '';
    const m = href.match(/\/(?:pelicula|serie)\/(\d+)/);
    if (!m) return null;
    const id = m[1];
    const isTv = href.includes('/serie/');
    const img = a.querySelector('img');
    let title = (img && img.getAttribute('alt')) || a.getAttribute('title') || '';
    if (!title) { const h = a.querySelector('h2,h3,span'); title = h ? h.textContent.trim() : ''; }
    title = title.replace(/^Ver\s+/i,'').trim() || (isTv ? 'Serie ' + id : 'Película ' + id);
    const poster = img ? fixUrl(img.getAttribute('src'), CINEHAX_URL) : null;
    return { id, type: isTv?'tv':'movie', title, poster };
  }

  async function loadCategorizedHome(filterType) {
    const isMovie = filterType === 'movie';
    app.innerHTML = `<div class="loader">Cargando ${isMovie ? 'películas' : 'series'}...</div>`;
    try {
      const html = await httpGet(CINEHAX_URL + '/', CINEHAX_URL + '/');
      let categories = [];
      const doc = new DOMParser().parseFromString(html, 'text/html');
      
      doc.querySelectorAll('.scroll-section, #top-slider-container, #top-series-slider-container').forEach(el => {
        if (el.id === 'cx-continue') return;
        let name = el.id === 'top-slider-container' ? 'Top Películas Hoy' : el.id === 'top-series-slider-container' ? 'Top Series Hoy' : null;
        if (!name) { 
          const h = el.querySelector('h2,h3'); 
          if (!h) return; 
          name = h.textContent.replace(/Ver todo.*/i,'').trim(); 
        }

        const lowerName = name.toLowerCase();
        if (isMovie && lowerName.includes('serie')) return;
        if (!isMovie && !lowerName.includes('serie')) return;

        const shows = []; const seen = new Set();
        el.querySelectorAll('a[href]').forEach(a => {
          const s = parseCineHaxCard(a);
          if (s && s.type === filterType && !seen.has(s.type+s.id)) { 
            seen.add(s.type+s.id); shows.push(s); 
          }
        });
        if (shows.length) categories.push({ name, list: shows });
      });

      if (categories.length === 0) app.innerHTML = `<div class="error">No se encontraron resultados.</div>`;
      else renderHome(categories);
    } catch (e) { app.innerHTML = `<div class="error">Error: ${escapeHtml(e.message)}</div>`; }
  }

  async function loadAnime() {
    app.innerHTML = '<div class="loader">Cargando Anime...</div>';
    try {
      const url = `${LATANIME_URL}/animes?p=1`;
      const html = await httpGet(url, LATANIME_URL + '/');
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const allAnimes = [];
      Array.from(doc.querySelectorAll('div.row > div')).forEach(el => {
        const a = el.querySelector('a');
        if (!a) return;
        const titleEl = el.querySelector('div.seriedetails > h3');
        let title = titleEl ? titleEl.textContent.trim() : 'Anime';
        const img = el.querySelector('img');
        let poster = img ? (img.getAttribute('data-src') || img.getAttribute('src')) : '';
        if(title && poster) allAnimes.push({ id: a.getAttribute('href'), type: 'anime', title, poster: fixUrl(poster, LATANIME_URL) });
      });

      if (allAnimes.length === 0) return app.innerHTML = '<div class="error">No hay animes.</div>';
      
      const mitad = Math.ceil(allAnimes.length / 2);
      const categories = [
        { name: 'Películas de Anime', list: allAnimes.slice(0, mitad) },
        { name: 'Series de Anime', list: allAnimes.slice(mitad) }
      ];
      renderHome(categories);
    } catch (e) { app.innerHTML = `<div class="error">Error: ${escapeHtml(e.message)}</div>`; }
  }

  async function fetchCineHaxExplore(type, page, genre = '', q = '') {
    const params = `page=${page}&type=${type}&genre=${genre}&network=&language=&sort=popular&time=week&q=${encodeURIComponent(q)}`;
    const url = `${CINEHAX_URL}/ajax?action=load_explore_data&${params}`;
    try {
      const raw = await httpGet(url, CINEHAX_URL + '/');
      const json = JSON.parse(raw);
      if (!json.success || !json.data || !json.data.html) return [];
      const doc = new DOMParser().parseFromString(json.data.html, 'text/html');
      const shows = [];
      doc.querySelectorAll('a[href*="/pelicula/"], a[href*="/serie/"]').forEach(a => {
        const s = parseCineHaxCard(a);
        if(s) shows.push(s);
      });
      return shows;
    } catch(e) { return []; }
  }

  async function loadGenre(id, page = 1) {
    const parts = id.split(':');
    const type = parts[0]; const slug = parts[1] || '';
    if (type === 'anime') {
      app.innerHTML = `<div class="loader">Cargando Anime...</div>`;
      try {
        const url = `${LATANIME_URL}/genero/${slug}?p=${page}`;
        const html = await httpGet(url, LATANIME_URL + '/');
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const shows = [];
        Array.from(doc.querySelectorAll('div.row > div')).forEach(el => {
          const a = el.querySelector('a');
          if (!a) return;
          const titleEl = el.querySelector('div.seriedetails > h3');
          let title = titleEl ? titleEl.textContent.trim() : 'Anime';
          const img = el.querySelector('img');
          let poster = img ? (img.getAttribute('data-src') || img.getAttribute('src')) : '';
          shows.push({ id: a.getAttribute('href'), type: 'anime', title, poster: fixUrl(poster, LATANIME_URL) });
        });
        renderGrid(`Anime: ${slug.toUpperCase()}`, shows);
      } catch(e) { app.innerHTML = `<div class="error">Error: ${e.message}</div>`; }
    } else {
      app.innerHTML = `<div class="loader">Cargando...</div>`;
      const shows = await fetchCineHaxExplore(type, page, slug);
      renderGrid(slug.toUpperCase(), shows);
    }
  }

  function renderSearchView() {
    app.innerHTML = `
      <div class="search-view">
        <div class="search-box">
          <input id="q-input" type="text" placeholder="Buscar películas, series o anime..." tabindex="0" />
          <button id="btn-search" tabindex="0">Buscar</button>
        </div>
      </div>
      <div id="search-results"></div>
    `;
    const input = document.getElementById('q-input');
    const btn = document.getElementById('btn-search');
    
    const doSearch = async () => {
      const q = input.value.trim();
      if (!q) return;
      const resContainer = document.getElementById('search-results');
      resContainer.innerHTML = '<div class="loader">Buscando...</div>';
      try {
        const shows = [];
        try {
          const urlCine = `${CINEHAX_URL}/ajax?action=tmdb_live_search&query=${encodeURIComponent(q)}`;
          const rawCine = await httpGet(urlCine, CINEHAX_URL + '/');
          const jsonCine = JSON.parse(rawCine);
          if (jsonCine.success && Array.isArray(jsonCine.data)) {
            jsonCine.data.forEach(it => {
              const isTv = it.media_type === 'tv' || (!it.title && it.name);
              shows.push({ id: String(it.id), type: isTv ? 'tv' : 'movie', title: it.title || it.name || '', poster: it.poster_path ? TMDB_IMG + it.poster_path : null });
            });
          }
        } catch(e){}
        try {
          const urlAnime = `${LATANIME_URL}/buscar?q=${encodeURIComponent(q)}`;
          const htmlAnime = await httpGet(urlAnime, LATANIME_URL + '/');
          const docAnime = new DOMParser().parseFromString(htmlAnime, 'text/html');
          Array.from(docAnime.querySelectorAll('div.row > div')).forEach(el => {
            const a = el.querySelector('a');
            if (!a) return;
            const titleEl = el.querySelector('div.seriedetails > h3');
            let title = titleEl ? titleEl.textContent.trim() : '';
            const img = el.querySelector('img');
            let poster = img ? (img.getAttribute('data-src') || img.getAttribute('src')) : '';
            if(title) shows.push({ id: a.getAttribute('href'), type: 'anime', title, poster: fixUrl(poster, LATANIME_URL) });
          });
        } catch(e){}
        if (shows.length > 0) {
          resContainer.innerHTML = `<div class="grid">${shows.map(cardHTML).join('')}</div>`;
          bindCards(resContainer);
          setTimeout(() => { const first = resContainer.querySelector('.card'); if(first) first.focus(); }, 100);
        } else resContainer.innerHTML = '<div class="error">Sin resultados</div>';
      } catch(e) { resContainer.innerHTML = `<div class="error">Error: ${escapeHtml(e.message)}</div>`; }
    };
    btn.addEventListener('click', doSearch);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
    autoFocus();
  }

  // --- MODAL CORREGIDO CON EXTRACCIÓN DE SINOPSIS REAL ---
  async function openDetail(type, id) {
    const modal = document.getElementById('modal');
    const titleEl = document.getElementById('modal-title');
    const descEl = document.getElementById('modal-desc');
    
    titleEl.textContent = (type === 'tv' ? 'Serie' : type === 'anime' ? 'Anime' : 'Película');
    descEl.textContent = 'Cargando sinopsis...';
    modal.classList.add('open');
    document.getElementById('modal-close').focus();

    try {
      let url = '';
      if (type === 'movie') url = `${CINEHAX_URL}/pelicula/${id}`;
      else if (type === 'tv') url = `${CINEHAX_URL}/serie/${id}`;
      else if (type === 'anime') url = id;

      const html = await httpGet(url, type === 'anime' ? LATANIME_URL + '/' : CINEHAX_URL + '/');
      const doc = new DOMParser().parseFromString(html, 'text/html');
      
      let synopsis = '';
      let realTitle = '';

      if (type === 'anime') {
        // Lógica de Latanime
        const titleNode = doc.querySelector('h1, .anime-title');
        if (titleNode) realTitle = titleNode.textContent.trim();
        
        // Buscar el contenedor de sinopsis específico de Latanime
        const descNode = doc.querySelector('.sinopsis, .description, .anime-synopsis, #info p');
        if (descNode) synopsis = descNode.textContent.trim();
        else {
          // Si no encuentra la clase, busca el párrafo más largo (suele ser la sinopsis)
          const ps = Array.from(doc.querySelectorAll('p'));
          const longestP = ps.reduce((a, b) => a.textContent.length > b.textContent.length ? a : b, {textContent: ''});
          if(longestP.textContent.length > 50) synopsis = longestP.textContent.trim();
        }
      } else {
        // Lógica de CineHax
        const titleNode = doc.querySelector('h1, .title');
        if (titleNode) realTitle = titleNode.textContent.trim();

        // CineHax suele usar .description para la sinopsis
        const descNode = doc.querySelector('.description, .synopsis, .overview');
        if (descNode) synopsis = descNode.textContent.trim();
        else {
          // Si no, busca un párrafo con clase text-muted o similar
          const p = doc.querySelector('p.text-muted, p.description, .movie-info p');
          if (p) synopsis = p.textContent.trim();
          else {
             // Buscar párrafo largo como último recurso
             const ps = Array.from(doc.querySelectorAll('p'));
             const longestP = ps.reduce((a, b) => a.textContent.length > b.textContent.length ? a : b, {textContent: ''});
             if(longestP.textContent.length > 50) synopsis = longestP.textContent.trim();
          }
        }
      }

      titleEl.textContent = realTitle || titleEl.textContent;
      
      // Limpiamos el texto de la sinopsis de posibles saltos de línea excesivos
      if (synopsis) {
        synopsis = synopsis.replace(/\s+/g, ' ').trim();
      }

      descEl.textContent = synopsis || 'No se encontró sinopsis detallada para este título.';
    } catch (e) {
      descEl.textContent = 'Error de conexión al cargar la sinopsis. Revisa tu conexión a internet.';
      console.error(e);
    }
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    const activeBtn = document.querySelector('aside button.active');
    if(activeBtn) activeBtn.focus();
  }

  navButtons.forEach(b => {
    b.addEventListener('click', () => {
      navButtons.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      const v = b.getAttribute('data-view');
      if (v === 'movies') loadCategorizedHome('movie');
      else if (v === 'tv') loadCategorizedHome('tv');
      else if (v === 'anime') loadAnime();
      else if (v === 'genres') renderGenres();
      else if (v === 'search') renderSearchView();
    });
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter') b.click(); });
  });

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-close').addEventListener('keydown', (e) => { if(e.key === 'Enter') closeModal(); });
  
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' || e.key === 'Escape') {
      if (document.getElementById('modal').classList.contains('open')) closeModal();
    }
  });

  loadCategorizedHome('movie');
  setTimeout(() => navButtons[0].focus(), 200);

})();
</script>
